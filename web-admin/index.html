<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxonomy Admin Panel</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-container">
            <h1>Taxonomy Admin</h1>
            <p>Sign in to manage taxonomies</p>
            <form id="login-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-screen" class="screen hidden">
        <!-- Header -->
        <header>
            <h1>Taxonomy Admin Panel</h1>
            <div class="header-actions">
                <span id="user-email"></span>
                <button id="logout-btn">Sign Out</button>
            </div>
        </header>

        <!-- Specimen Type Tabs -->
        <nav class="tabs">
            <button class="tab active" data-type="Macrobenthos">Macrobenthos</button>
            <button class="tab" data-type="Zooplankton">Zooplankton</button>
            <button class="tab" data-type="Phytoplankton">Phytoplankton</button>
        </nav>

        <!-- Main Content -->
        <main>
            <!-- Toolbar -->
            <div class="toolbar">
                <button id="add-root-btn" class="btn-primary">+ Add Root Taxon</button>
                <button id="refresh-btn">Refresh</button>
                <span id="taxa-count"></span>
            </div>

            <!-- Taxonomy Tree -->
            <div class="content-area">
                <div id="taxonomy-tree" class="tree-container">
                    <p class="loading">Loading taxonomy...</p>
                </div>

                <!-- Details Panel -->
                <div id="details-panel" class="details-panel hidden">
                    <h3 id="details-title">Taxon Details</h3>
                    <form id="taxon-form">
                        <input type="hidden" id="taxon-id">
                        <input type="hidden" id="taxon-parent-id">

                        <label>Name:</label>
                        <input type="text" id="taxon-name" required>

                        <label>Rank:</label>
                        <select id="taxon-rank" required>
                            <option value="">Select rank...</option>
                        </select>

                        <label>Notes:</label>
                        <textarea id="taxon-notes" rows="3"></textarea>

                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Save</button>
                            <button type="button" id="cancel-btn">Cancel</button>
                            <button type="button" id="delete-btn" class="btn-danger">Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <!-- Status Bar -->
        <footer>
            <span id="status-message">Ready</span>
            <span id="last-modified"></span>
        </footer>
    </div>

    <!-- Add Child Modal -->
    <div id="add-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Add Child Taxon</h3>
            <p>Parent: <strong id="modal-parent-name"></strong></p>
            <form id="add-child-form">
                <input type="hidden" id="add-parent-id">

                <label>Name:</label>
                <input type="text" id="add-name" required>

                <label>Rank:</label>
                <select id="add-rank" required>
                    <option value="">Select rank...</option>
                </select>

                <label>Notes:</label>
                <textarea id="add-notes" rows="2"></textarea>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Add</button>
                    <button type="button" id="modal-cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
